apiVersion: v1
kind: Pod
metadata:
  name: {{ include "dev-portal.fullname" . }}-test-connection
  labels:
    {{- include "dev-portal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    # More than /healthz: that route is a bare handler and answers 200 even if
    # every rendered page is broken. So this fetches one URL per thing that can
    # independently fail:
    #   /                     server-side rendering works at all
    #   /catalog              a page that resolves the outbound hub addresses
    #                         from the ConfigMap — proves envFrom is wired
    #   /catalog/stacks/ios   the [slug] dynamic route resolves
    #   /doc/                 the prerendered Starlight docs shipped in the image
    #   /doc/practices/bdd/   a nested docs page, not just the section index
    - name: health
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}/
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}/catalog
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}/catalog/stacks/ios
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}/doc/
        - http://{{ include "dev-portal.fullname" . }}:{{ .Values.service.port }}/doc/practices/bdd/
