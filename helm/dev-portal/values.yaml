# Default values for dev-portal.
# Tuned for a local single-node cluster (Rancher Desktop / Docker Desktop).

replicaCount: 1

image:
  repository: dev-portal
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # IfNotPresent so a locally built image is used without a registry push.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the standalone @astrojs/node server listens on. Injected as PORT and
# used as the container port, so the two cannot drift apart.
containerPort: 4321

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname template when empty.
  name: ""

podAnnotations: {}
podLabels: {}

# Update strategy, applied as-is. The portal is stateless, so a rolling update
# is always safe here.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  # Must match the "app" user baked into dev-portal/Dockerfile. 1000 is
  # deliberately avoided there — the node base image already uses it.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4321

# On by default, matching the arch-hub charts and deviating from the api-hub
# ones: a browser frontend nobody can open is not a useful default.
ingress:
  enabled: true
  # Empty uses the cluster's default IngressClass. Rancher Desktop ships
  # "traefik" as the default.
  className: ""
  annotations: {}
  hosts:
    - host: dev-portal.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # No CPU limit: the Node server is bursty at startup and during SSR.
    memory: 512Mi

# Probes hit the /healthz route served by src/pages/healthz.ts. Node boots
# fast, so the startup budget is tight.
probes:
  path: /healthz
  startup:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration.
# Rendered into a ConfigMap and injected wholesale via envFrom.
#
# Every value here is a **browser-facing link, not an in-cluster call**: the
# visitor's browser resolves it, so an in-cluster address like
# http://api-portal:4321 would be wrong even though the portal is
# server-rendered. src/lib/links.ts reads each one through process.env at call
# time and falls back to the same default the chart ships — so an unset value
# and the default look identical in the page. Override one to something
# obviously wrong if you ever need to prove the wiring works.
# ---------------------------------------------------------------------------
app:
  # The API catalog panel on /catalog. api-hub owns the contracts, their
  # scorecards and the registry end to end, so the panel links out rather than
  # rendering a staler second view.
  apiPortalUrl: http://api-portal.localhost

  # arch-hub's own portal, linked from the site footer.
  archPortalUrl: http://arch-portal.localhost

  # The C4 catalog panel — arch-hub's arch-c4 release, its own deployment with
  # its own ingress host. Also reached from the prerendered /doc/* pages through
  # the /go/c4 redirect, so changing this takes effect on a restart without
  # rebuilding the image.
  archC4Url: http://arch-c4.localhost

  # The Events catalog panel — arch-hub's arch-eventcatalog release.
  archEventcatalogUrl: http://arch-eventcatalog.localhost

  # The Components catalog panel — arch-hub's arch-appmap release.
  archAppmapUrl: http://arch-appmap.localhost

  # Arbitrary extra entries, merged verbatim into the same ConfigMap and so
  # injected as env vars too:
  #   extraConfig:
  #     LOG_LEVEL: debug
  extraConfig: {}

# Flags passed to the Node process, e.g. "--max-old-space-size=384".
nodeOptions: ""

# Additional raw environment variables (full valueFrom syntax available), e.g.
#   - name: SOME_SECRET
#     valueFrom:
#       secretKeyRef: { name: portal, key: token }
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
