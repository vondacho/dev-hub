[defaults]
# Every play here runs on the controller and talks to a cluster API — there are
# no managed hosts to SSH into. The inventory exists to carry per-environment
# variables, not machines.
inventory        = inventories/generic
roles_path       = roles
collections_path = collections
# Readable multi-line output. Not `stdout_callback = yaml`: that resolved to
# community.general.yaml, which was removed in community.general 12 — this is
# the built-in replacement.
result_format = yaml
# Show the task that is running before it finishes, so a helm upgrade waiting
# on a rollout does not look like a hang.
display_skipped_hosts = false
retry_files_enabled   = false
interpreter_python    = auto_silent

[inventory]
unparsed_is_failed = true
