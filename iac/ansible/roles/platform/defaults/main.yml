---
# Cluster-side platform, the Ansible counterpart of
# iac/terraform/modules/platform. Same charts, same versions, same issuer —
# whichever path runs second reconciles the other's release.

ingress_nginx: true
# Pinned. An ingress controller that upgrades itself under you is an outage
# waiting for a Tuesday.
ingress_nginx_version: "4.15.1"
ingress_nginx_replicas: 2
ingress_service_type: LoadBalancer
ingress_service_annotations: {}
# Local preserves the client source IP and only routes to nodes running a
# controller pod. Cluster survives an uneven spread and hides the client behind
# SNAT.
ingress_external_traffic_policy: Local
# Merged last into the ingress-nginx release, as a structure.
ingress_nginx_extra_values: {}

cert_manager: true
cert_manager_version: "v1.21.1"
cluster_issuer_name: letsencrypt
# Required while cert_manager is on: ACME registration fails without a contact
# address, and it is the only channel a broken renewal announces itself on.
acme_email: ""
acme_staging: false

# EKS ships without one; DOKS and most managed clusters already have one, and a
# second install fights the first over the metrics.k8s.io APIService.
metrics_server: false
metrics_server_version: "3.13.1"

# Longer than the app default: these wait on a cloud load balancer.
platform_wait_timeout: 15m
