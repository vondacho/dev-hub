---
- name: Refuse to install cert-manager without an ACME contact address
  ansible.builtin.assert:
    that: acme_email | length > 0
    fail_msg: >-
      acme_email is required when cert_manager is enabled: Let's Encrypt
      refuses ACME registration without a contact address.
  when: cert_manager | bool

- name: ingress-nginx
  kubernetes.core.helm:
    release_name: ingress-nginx
    chart_repo_url: https://kubernetes.github.io/ingress-nginx
    chart_ref: ingress-nginx
    chart_version: "{{ ingress_nginx_version }}"
    release_namespace: ingress-nginx
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path | expanduser }}"
    context: "{{ kube_context | default(omit, true) }}"
    values: "{{ ingress_nginx_values | combine(ingress_nginx_extra_values, recursive=True) }}"
    atomic: true
    wait: true
    # Waits on the cloud provisioning an actual load balancer.
    wait_timeout: "{{ platform_wait_timeout }}"
  vars:
    ingress_nginx_values:
      controller:
        replicaCount: "{{ ingress_nginx_replicas }}"
        service:
          type: "{{ ingress_service_type }}"
          annotations: "{{ ingress_service_annotations }}"
          externalTrafficPolicy: "{{ ingress_external_traffic_policy }}"
        # Marked default so a chart leaving ingress.className empty still
        # lands here.
        ingressClassResource:
          name: nginx
          enabled: true
          default: true
        config:
          use-gzip: "true"
          use-forwarded-headers: "true"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
  when: ingress_nginx | bool

- name: cert-manager
  kubernetes.core.helm:
    release_name: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_ref: cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: cert-manager
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path | expanduser }}"
    context: "{{ kube_context | default(omit, true) }}"
    values:
      # Let the chart own the CRDs. Applying them out of band means an upgrade
      # silently leaves the old schema in place.
      crds:
        enabled: true
        keep: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
    atomic: true
    wait: true
    wait_timeout: "{{ platform_wait_timeout }}"
  when: cert_manager | bool

# The same one-template chart the Terraform platform module installs, from the
# same directory — iac/charts/cluster-issuer.
- name: ClusterIssuer
  kubernetes.core.helm:
    release_name: cluster-issuer
    chart_ref: "{{ iac_root }}/charts/cluster-issuer"
    release_namespace: cert-manager
    create_namespace: false
    kubeconfig: "{{ kubeconfig_path | expanduser }}"
    context: "{{ kube_context | default(omit, true) }}"
    values:
      name: "{{ cluster_issuer_name }}"
      email: "{{ acme_email }}"
      staging: "{{ acme_staging }}"
      # Solved over HTTP-01 through the controller above, so an issuer that
      # exists always has something to answer the challenge.
      ingressClassName: nginx
    atomic: true
    wait: true
    wait_timeout: 5m
  when: cert_manager | bool

- name: metrics-server
  kubernetes.core.helm:
    release_name: metrics-server
    chart_repo_url: https://kubernetes-sigs.github.io/metrics-server/
    chart_ref: metrics-server
    chart_version: "{{ metrics_server_version }}"
    release_namespace: kube-system
    create_namespace: false
    kubeconfig: "{{ kubeconfig_path | expanduser }}"
    context: "{{ kube_context | default(omit, true) }}"
    atomic: true
    wait: true
    wait_timeout: 5m
  when: metrics_server | bool

- name: Read the load balancer the controller provisioned
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: ingress-nginx-controller
    namespace: ingress-nginx
    kubeconfig: "{{ kubeconfig_path | expanduser }}"
    context: "{{ kube_context | default(omit, true) }}"
  register: ingress_service
  when: ingress_nginx | bool

- name: Point DNS here
  ansible.builtin.debug:
    msg: >-
      {{ (ingress_service.resources[0].status.loadBalancer.ingress | default([{}]))[0]
         | dict2items | map(attribute='value') | join(' ')
         | default('not assigned yet — re-run in a few minutes', true) }}
  when:
    - ingress_nginx | bool
    - ingress_service.resources | default([]) | length > 0
